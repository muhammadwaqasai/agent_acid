[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-acid"
version = "0.1.0"
description = "ACID-style transaction guarantees (rollback + session-memory guardrails) for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Waqas" }
]
keywords = ["ai", "agents", "llm", "rollback", "guardrails", "safety", "transactions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/muhammadwaqasai/agent_acid"
Repository = "https://github.com/muhammadwaqasai/agent_acid"

[tool.setuptools.packages.find]
include = ["agent_acid*"]
